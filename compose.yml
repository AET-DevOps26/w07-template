services:
  server:
    image: ghcr.io/aet-devops25/w10-template/server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=jdbc:postgresql://database:5432/mensa
      - LLM_SERVICE_URL=http://llm:5001
    ports:
      - "8080:8080"
    restart: unless-stopped

  database:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-supersecret}
      - POSTGRES_DB=${POSTGRES_DB:-mensa}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  client:
    image: ghcr.io/aet-devops25/w10-template/client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8080/api}
    depends_on:
      - server
    restart: unless-stopped

  llm:
    image: ghcr.io/aet-devops25/w10-template/llm:latest
    build:
      context: ./llm
      dockerfile: Dockerfile
    environment:
      # LM Studio on the host machine. host.docker.internal works on
      # Docker Desktop (macOS/Windows) out of the box; extra_hosts below
      # extends the same name to Linux hosts.
      - LLM_API_URL=${LLM_API_URL:-http://host.docker.internal:1234/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-e2b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Set LOGOS_API_KEY in .env to switch to the TUM-hosted Logos
      # endpoint (openai/gpt-oss-120b). When set, it overrides the
      # LM Studio defaults above. Unset = LM Studio.
      - LOGOS_API_KEY=${LOGOS_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5001"
    restart: unless-stopped

volumes:
  db_data:
